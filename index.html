<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Santa 🎰</title>
<style>
  :root{
    --bg1:#3a0b22; --bg2:#12040c; --gold:#ffcf4a; --gold2:#b8860b; --red:#e63946; --green:#2fbf71;
    --cw:min(96px, calc((100vw - 118px)/3));
    --ch:calc(var(--cw) * 1.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:radial-gradient(ellipse at 50% 0%, var(--bg1), var(--bg2) 70%) fixed;
    color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow-x:hidden;
  }
  #lights{position:fixed;top:0;left:0;right:0;height:18px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
  #lights span{width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-top:3px;animation:twinkle 1.6s infinite}
  @keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.3)}50%{opacity:.35;filter:brightness(.8)}}
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  #snow span{position:absolute;top:-20px;color:#fff;opacity:.55;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:34px 16px 60px;text-align:center}
  h1{font-size:clamp(26px,7vw,34px);margin:6px 0 4px;letter-spacing:.5px;
     background:linear-gradient(#fff3b0,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
     text-shadow:0 0 30px rgba(255,207,74,.25)}
  #hello{margin:0 0 10px;font-size:18px;opacity:.92}
  .budget-pill{display:inline-block;background:rgba(47,191,113,.15);border:1px solid var(--green);color:#9df2c4;
     padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;margin-bottom:18px}
  #ribbon{background:var(--red);color:#fff;font-weight:800;font-size:12px;letter-spacing:1px;padding:5px 10px;border-radius:6px;display:inline-block;margin-bottom:8px}

  /* machine */
  .cabinet{position:relative;margin:0 auto;width:max-content;max-width:100%;
     background:linear-gradient(160deg,#7a1230,#3d0618 60%,#2a040f);
     border:4px solid var(--gold);border-radius:22px;padding:14px 46px 16px 16px;
     box-shadow:0 0 0 3px #5a3d00, 0 18px 50px rgba(0,0,0,.6), 0 0 40px rgba(255,207,74,.18), inset 0 0 30px rgba(0,0,0,.5)}
  .marquee{font-weight:900;letter-spacing:6px;color:var(--gold);font-size:13px;margin-bottom:10px;animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
  .reels{position:relative;display:flex;gap:8px;background:#0b0306;padding:8px;border-radius:12px;border:3px solid #000;
     box-shadow:inset 0 0 20px #000}
  .reel{width:var(--cw);height:calc(var(--ch) * 3);overflow:hidden;background:linear-gradient(#f4ecd8,#fff8e6 50%,#f4ecd8);border-radius:6px;position:relative}
  .reel::after{content:"";position:absolute;inset:0;pointer-events:none;
     background:linear-gradient(rgba(0,0,0,.55),transparent 28%,transparent 72%,rgba(0,0,0,.55))}
  .strip{will-change:transform}
  .strip.moving{filter:blur(2.5px)}
  .cell{height:var(--ch);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#2a1a1a}
  .face{width:calc(var(--cw) * .66);height:calc(var(--cw) * .66);border-radius:50%;object-fit:cover;border:3px solid #7a1230;background:#ddd}
  .avatar{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:calc(var(--cw) * .3)}
  .cname{font-size:calc(var(--cw) * .125 + 1px);font-weight:800;text-transform:uppercase;letter-spacing:.3px;max-width:100%;white-space:nowrap}
  .payline{position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:var(--red);box-shadow:0 0 8px var(--red);z-index:3;pointer-events:none}
  .payline::before,.payline::after{content:"";position:absolute;top:-7px;border:8px solid transparent}
  .payline::before{left:-4px;border-left-color:var(--red)}
  .payline::after{right:-4px;border-right-color:var(--red)}
  .reels.win .payline{animation:flash .25s steps(2) 8;background:var(--gold);box-shadow:0 0 14px var(--gold)}
  @keyframes flash{50%{opacity:.2}}
  .cell.win .face{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold);animation:pop .5s ease 2}
  @keyframes pop{50%{transform:scale(1.15)}}

  #spin{margin-top:14px;width:100%;padding:14px 10px;font-size:17px;font-weight:900;letter-spacing:1px;color:#2a0a00;cursor:pointer;
     background:linear-gradient(#ffe27a,var(--gold) 55%,#d9a30f);border:none;border-radius:12px;
     box-shadow:0 5px 0 #8a6200,0 10px 20px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
  #spin:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #8a6200}
  #spin:disabled{filter:grayscale(.6) brightness(.8);cursor:default}

  .lever{position:absolute;right:12px;top:78px;width:26px;height:110px;cursor:pointer;background:none;border:none;padding:0}
  .lever .stick{position:absolute;left:10px;top:18px;width:6px;height:84px;background:linear-gradient(90deg,#999,#eee,#888);border-radius:3px}
  .lever .knob{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;
     background:radial-gradient(circle at 35% 30%,#ff8d95,var(--red) 60%,#7d0b16)}
  .lever.pull .knob{animation:knob .7s ease}
  @keyframes knob{0%{transform:translateY(0)}40%{transform:translateY(60px)}100%{transform:translateY(0)}}

  /* result */
  #result{margin-top:26px;animation:rise .7s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes rise{from{opacity:0;transform:translateY(30px) scale(.9)}}
  .card{background:linear-gradient(160deg,#fff8e6,#ffe9b0);color:#3a1a00;border-radius:20px;padding:22px 18px;
     border:3px solid var(--gold);box-shadow:0 0 40px rgba(255,207,74,.35),0 12px 30px rgba(0,0,0,.5)}
  .kicker{font-weight:800;font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:#8a2a00}
  .card .face.big{width:130px;height:130px;margin:12px auto 6px;display:block;font-size:56px;border-width:5px}
  .who{font-size:38px;font-weight:900;letter-spacing:1px;color:#7a1230}
  .budget-big{display:inline-block;margin:8px 0 4px;background:#1c7a4a;color:#fff;font-weight:900;font-size:20px;padding:8px 18px;border-radius:999px}
  .card p{margin:8px 0 0;font-size:15px}
  .egg{font-weight:800;color:#b3002d;font-size:15px;animation:wiggle 1s ease infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
  .small{font-size:13px!important;opacity:.7}
  #again{margin-top:14px;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer}
  #mute{position:fixed;right:12px;bottom:12px;z-index:6;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
  #error{margin-top:30px;background:rgba(230,57,70,.15);border:1px solid var(--red);padding:18px;border-radius:14px}
  .pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .pick{padding:14px 8px;font-size:17px;font-weight:800;border-radius:12px;border:2px solid var(--gold);background:rgba(255,207,74,.1);color:#fff;cursor:pointer;font-family:inherit}
  .pick:hover{background:rgba(255,207,74,.28)}
  .pick.yes{background:var(--green);border-color:var(--green);color:#052b16}
  .pick.no{border-color:#888;color:#ddd;background:none}
  .ask{margin-top:10px}
  .ask p{margin:10px 0 14px}
  .ask .pick{margin:4px;color:#3a1a00;border-color:#7a1230;background:#fff}
  .ask .pick.yes{background:var(--green);border-color:var(--green);color:#fff}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="lights"></div>
<div id="snow"></div>

<main>
  <div id="ribbon" hidden>PREVIEW — not a real draw</div>
  <h1>🎰 Secret Santa Jackpot</h1>
  <p id="hello"></p>
  <div class="budget-pill" id="budgetTop"></div>

  <div id="picker" hidden></div>

  <div id="machineBox" hidden>
    <div class="cabinet">
      <div class="marquee">★ ★ JACKPOT ★ ★</div>
      <div class="reels" id="reels">
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <div class="reel"><div class="strip"></div></div>
        <div class="payline"></div>
      </div>
      <button id="spin">🎰 PULL THE LEVER</button>
      <button class="lever" id="lever" aria-label="Pull the lever"><span class="stick"></span><span class="knob"></span></button>
    </div>
    <p style="opacity:.7;font-size:13px;margin-top:14px">Three of the same face on the red line = your giftee.</p>
  </div>

  <div id="result" hidden></div>
  <div id="error" hidden></div>
</main>

<button id="mute" title="Sound on/off">🔊</button>
<canvas id="confetti"></canvas>

<script src="roster.js"></script>
<script>
(function(){
  const S = window.SANTA;
  const byId = Object.fromEntries(S.people.map(p => [p.id, p]));
  const $ = s => document.querySelector(s);

  /* ---------- decorations ---------- */
  const lights = $('#lights');
  const colors = ['#ff4d5a','#ffd24a','#4dd68c','#5aa9ff'];
  const nBulbs = Math.ceil(window.innerWidth / 26);
  for (let i = 0; i < nBulbs; i++) {
    const b = document.createElement('span');
    b.style.background = colors[i % 4];
    b.style.animationDelay = (i % 4) * .4 + 's';
    b.style.boxShadow = '0 0 8px ' + colors[i % 4];
    lights.appendChild(b);
  }
  for (let i = 0; i < 36; i++) {
    const f = document.createElement('span');
    f.textContent = '❄';
    f.style.left = Math.random() * 100 + 'vw';
    f.style.fontSize = (8 + Math.random() * 14) + 'px';
    f.style.animationDuration = (8 + Math.random() * 12) + 's';
    f.style.animationDelay = (-Math.random() * 18) + 's';
    $('#snow').appendChild(f);
  }

  /* ---------- read the personal link ---------- */
  function decode(hash) {
    let s = hash.replace(/^#/, '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bytes = Uint8Array.from(atob(s), c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  let data = null;
  try { data = decode(location.hash); } catch (e) {}
  window.addEventListener('hashchange', () => location.reload());
  // personal link: {me, to}   ·   group link (v:2): {m: {giver: receiver, ...}}
  const personal = !!(data && data.v !== 2 && byId[data.me] && byId[data.to]);
  const group = !!(data && data.v === 2 && data.m && Object.keys(data.m).length >= 3 &&
                  Object.entries(data.m).every(([a, b]) => byId[a] && byId[b]));
  if (!personal && !group) {
    $('#budgetTop').hidden = true;
    $('#error').hidden = false;
    $('#error').innerHTML = '<b>Hmm, this link doesn\'t look right 🤔</b><br><br>Open the exact link the organiser sent (the whole thing, including the part after the #).';
    return;
  }
  let me, target, storeKey, isTest = false;
  $('#budgetTop').textContent = '💶 Budget: ' + S.budget.toLowerCase();

  /* ---------- faces: coloured circle with the first letter ---------- */
  function faceHTML(p, cls) {
    cls = cls || '';
    const hue = [...p.id].reduce((a, c) => a + c.charCodeAt(0) * 7, 0) % 360;
    return '<div class="face avatar ' + cls + '" style="background:hsl(' + hue + ' 55% 42%)">' + p.name[0] + '</div>';
  }
  const cellHTML = (p, win) => '<div class="cell' + (win ? ' win' : '') + '" data-id="' + p.id + '">' + faceHTML(p) + '<div class="cname">' + p.name + '</div></div>';

  /* ---------- sound ---------- */
  let ac = null, muted = false;
  function audio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function beep(freq, dur, type, vol, when) {
    if (muted || !ac) return;
    when = when || 0;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + when;
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .04, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + .02);
  }
  function tickLoop(total) {
    const t0 = performance.now();
    (function step() {
      const t = performance.now() - t0;
      if (t > total) return;
      beep(520 + Math.random() * 380, .03, 'square', .02);
      const k = t / total;
      setTimeout(step, 55 + k * k * 280);
    })();
  }
  function jingle() {
    [523, 659, 784, 1047, 1319, 1047, 1319, 1568].forEach((f, i) => beep(f, .22, 'triangle', .07, i * .11));
  }
  $('#mute').onclick = () => { muted = !muted; $('#mute').textContent = muted ? '🔇' : '🔊'; };

  /* ---------- confetti ---------- */
  const cv = $('#confetti'), cx = cv.getContext('2d');
  let bits = [], raf = null;
  function fit() { cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', fit); fit();
  function confetti() {
    const cols = ['#ff4d5a', '#ffd24a', '#4dd68c', '#5aa9ff', '#fff', '#ff8bd1'];
    for (let i = 0; i < 180; i++) {
      bits.push({
        x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45,
        vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4,
        s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: cols[i % cols.length], life: 140 + Math.random() * 60
      });
    }
    if (!raf) loop();
  }
  function loop() {
    cx.clearRect(0, 0, cv.width, cv.height);
    bits = bits.filter(b => b.life-- > 0 && b.y < cv.height + 20);
    bits.forEach(b => {
      b.vy += .35; b.x += b.vx; b.y += b.vy; b.vx *= .99; b.r += b.vr;
      cx.save(); cx.translate(b.x, b.y); cx.rotate(b.r); cx.fillStyle = b.c;
      cx.fillRect(-b.s / 2, -b.s / 3, b.s, b.s * .6); cx.restore();
    });
    raf = bits.length ? requestAnimationFrame(loop) : null;
    if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
  }

  /* ---------- the machine ---------- */
  const strips = [...document.querySelectorAll('.strip')];
  const people = S.people;
  const rand = n => Math.floor(Math.random() * n);
  const pick = notIds => { let p; do { p = people[rand(people.length)]; } while (notIds.includes(p.id)); return p; };
  let current = [];   // what each reel currently shows [top, mid, bottom]
  let spinning = false, done = false;

  // a grid where the middle row is the winner, and top/bottom rows are NOT a matching line
  function winningGrid() {
    let tops, bots;
    do { tops = [0, 1, 2].map(() => pick([target.id])); } while (tops.every(p => p.id === tops[0].id));
    do { bots = [0, 1, 2].map(() => pick([target.id])); } while (bots.every(p => p.id === bots[0].id));
    return [0, 1, 2].map(i => [tops[i], target, bots[i]]);
  }
  // a start grid with NO matching line at all
  function idleGrid() {
    let mids;
    do { mids = [0, 1, 2].map(() => pick([])); } while (new Set(mids.map(p => p.id)).size < 2);
    return mids.map(m => [pick([m.id]), m, pick([m.id])]);
  }
  function renderStatic(grid, win) {
    strips.forEach((s, i) => {
      s.style.transition = 'none';
      s.style.transform = 'translateY(0)';
      s.classList.remove('moving');
      s.innerHTML = grid[i].map((p, r) => cellHTML(p, win && r === 1)).join('');
    });
    current = grid;
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    audio();
    $('#spin').disabled = true;
    $('#reels').classList.remove('win');
    $('#result').hidden = true;
    const lever = $('#lever'); lever.classList.remove('pull'); void lever.offsetWidth; lever.classList.add('pull');

    const finals = winningGrid();
    const durs = [2400, 3500, 5300];
    tickLoop(durs[2]);
    strips.forEach((strip, i) => {
      const dur = durs[i];
      const n = 6 + Math.round(dur / 1000 * 10);
      const mid = []; let prev = current[i][2].id;
      for (let k = 0; k < n - 6; k++) { const p = pick([prev]); mid.push(p); prev = p.id; }
      const cells = [...current[i], ...mid, ...finals[i]];
      strip.style.transition = 'none';
      strip.innerHTML = cells.map(p => cellHTML(p)).join('');
      strip.style.transform = 'translateY(0)';
      void strip.offsetHeight;
      strip.classList.add('moving');
      strip.style.transition = 'transform ' + dur + 'ms cubic-bezier(.15,.62,.2,1)';
      strip.style.transform = 'translateY(' + (-((n - 3) / n * 100)) + '%)';
      setTimeout(() => strip.classList.remove('moving'), dur * .78);
      setTimeout(() => { beep(110, .2, 'sine', .14); current[i] = finals[i]; }, dur);
    });
    setTimeout(win, durs[2] + 350);
  }

  function win() {
    strips.forEach(s => s.children[s.children.length - 2].classList.add('win'));
    $('#reels').classList.add('win');
    jingle(); confetti();
    setTimeout(confetti, 600);
    try { if (!isTest) localStorage.setItem(storeKey, '1'); } catch (e) {}
    done = true; spinning = false;
    $('#spin').disabled = false;
    $('#spin').textContent = '🔁 WATCH IT AGAIN';
    setTimeout(showResult, 900);
  }

  function showResult() {
    const r = $('#result');
    r.hidden = false;
    r.innerHTML =
      '<div class="card">' +
        '<div class="kicker">🎁 You\'re the Secret Santa for</div>' +
        faceHTML(target, 'big') +
        '<div class="who">' + target.name + '</div>' +
        '<div class="budget-big">💶 ' + S.budget + '</div>' +
        '<p>' + S.budgetNote + '</p>' +
        (target.egg ? '<p class="egg">' + target.name + ' ' + target.egg + '</p>' : '') +
        '<p class="small">Don\'t tell anyone — not even if the group chat begs. 🤐</p>' +
      '</div>';
    r.style.animation = 'none'; void r.offsetWidth; r.style.animation = '';
    r.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  $('#spin').onclick = spin;
  $('#lever').onclick = spin;

  /* ---------- start ---------- */
  function begin(meId, toId, d, test) {
    me = byId[meId]; target = byId[toId]; isTest = !!test;
    storeKey = 'santa-' + (d || 'x') + '-' + meId;
    $('#picker').hidden = true;
    $('#hello').textContent = 'Ho ho ho, ' + me.name + '! 🎅';
    if (isTest) $('#ribbon').hidden = false;
    $('#machineBox').hidden = false;
    let already = false;
    try { already = !isTest && localStorage.getItem(storeKey) === '1'; } catch (e) {}
    if (already) {
      renderStatic(winningGrid(), true);
      $('#reels').classList.add('win');
      done = true;
      $('#spin').textContent = '🔁 WATCH IT AGAIN';
      showResult();
    } else {
      renderStatic(idleGrid(), false);
    }
  }

  // group link: first everyone says who they are, then the machine opens
  const lockKey = group ? 'santa-who-' + (data.d || 'x') + (data.test ? '-test' : '') : '';
  function showPicker() {
    let locked = null;
    try { locked = localStorage.getItem(lockKey); } catch (e) {}
    if (locked && data.m[locked]) return begin(locked, data.m[locked], data.d, !!data.test);
    if (data.test) $('#ribbon').hidden = false;
    $('#hello').textContent = 'Ho ho ho! 🎅 First things first — who are you?';
    const box = $('#picker');
    box.hidden = false;
    box.innerHTML = '<div class="pick-grid">' +
      Object.keys(data.m).map(id => '<button class="pick" data-id="' + id + '">' + byId[id].name + '</button>').join('') +
      '</div>';
    box.onclick = e => { const b = e.target.closest('.pick'); if (b) confirmWho(b.dataset.id); };
  }
  function confirmWho(id) {
    const box = $('#picker'), nm = byId[id].name;
    box.onclick = null;
    box.innerHTML = '<div class="card ask"><b style="font-size:20px">You are ' + nm + '?</b>' +
      '<p>Only pick your <u>own</u> name — picking someone else spoils their surprise. This locks on this device.</p>' +
      '<button class="pick yes" id="yes">Yes, I\'m ' + nm + '</button><button class="pick no" id="no">Back</button></div>';
    $('#yes').onclick = () => {
      try { localStorage.setItem(lockKey, id); } catch (e) {}
      begin(id, data.m[id], data.d, !!data.test);
    };
    $('#no').onclick = showPicker;
  }

  if (personal) begin(data.me, data.to, data.d, !!data.test);
  else showPicker();
})();
</script>
</body>
</html>
